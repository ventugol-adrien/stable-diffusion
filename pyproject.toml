[project]
name = "stable-diffusion-tools"
version = "0.1.0"
description = "Shared tooling for the CUDA and ROCm Stable Diffusion profiles"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.uv]
package = false
